<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberShield | Create Account</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --green: #39ff14;
            --green-light: #a3ff91;
            --muted: #9aa99d;
        }

        body {
            min-height: 100vh;
            padding: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: #f1f5f2;
            background:
                radial-gradient(ellipse at top, #142a18, transparent 55%),
                radial-gradient(circle at bottom right, #101d12, transparent 40%),
                #050807;
        }

        .register-container {
            width: 100%;
            max-width: 465px;
            animation: appear 0.6s ease-out;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand-icon {
            width: 72px;
            height: 72px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 14px;
            font-size: 38px;
            border-radius: 22px;
            border: 1px solid #43873b;
            background: linear-gradient(145deg, #1b3020, #0b120c);
            box-shadow:
                0 0 25px rgba(57, 255, 20, 0.13),
                6px 6px 14px rgba(0, 0, 0, 0.4),
                inset 1px 1px 4px rgba(255, 255, 255, 0.05);
        }

        .brand h1 {
            font-size: 31px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .brand h1 span {
            color: var(--green);
            text-shadow: 0 0 15px rgba(57, 255, 20, 0.3);
        }

        .brand p {
            color: var(--muted);
            font-size: 12px;
            margin-top: 9px;
            letter-spacing: 1px;
        }

        .register-card {
            position: relative;
            overflow: hidden;
            background: linear-gradient(145deg, #111b13, #080d09);
            border: 1px solid #315a35;
            border-radius: 19px;
            padding: 30px;
            box-shadow:
                0 18px 45px rgba(0, 0, 0, 0.45),
                0 0 25px rgba(57, 255, 20, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        .register-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 20%;
            width: 60%;
            height: 2px;
            background: var(--green);
            box-shadow: 0 0 16px var(--green);
        }

        .secure-tag {
            display: inline-block;
            padding: 6px 10px;
            margin-bottom: 16px;
            border: 1px solid rgba(57, 255, 20, 0.22);
            border-radius: 5px;
            background: rgba(57, 255, 20, 0.06);
            color: var(--green);
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 1.4px;
        }

        .register-card h2 {
            font-size: 25px;
            margin-bottom: 9px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.7;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            color: #dce7de;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 9px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            background: #080e09;
            color: #f1f5f2;
            border: 1px solid #2b4430;
            border-radius: 9px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        input::placeholder {
            color: #708073;
        }

        input:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(57, 255, 20, 0.09);
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border: 1px solid var(--green);
            border-radius: 9px;
            background: var(--green);
            color: #061006;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 5px 0 #1b7c12;
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow:
                0 7px 0 #1b7c12,
                0 0 22px rgba(57, 255, 20, 0.17);
            filter: brightness(1.05);
        }

        .register-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #1b7c12;
        }

        .login-link {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
            line-height: 1.8;
            color: #a9b8ac;
        }

        .login-link a,
        .back-link {
            color: var(--green-light);
            text-decoration: none;
        }

        .login-link a {
            font-weight: bold;
        }

        .login-link a:hover,
        .back-link:hover {
            color: white;
            text-decoration: underline;
        }

        .back-link {
            display: block;
            margin-top: 23px;
            text-align: center;
            color: #93a396;
            font-size: 13px;
        }

        .bottom-note {
            text-align: center;
            color: #637367;
            font-size: 10px;
            letter-spacing: 1px;
            margin-top: 23px;
        }

        @media (max-width: 480px) {
            body {
                padding: 20px 15px;
            }

            .register-card {
                padding: 25px 21px;
            }

            .brand h1 {
                font-size: 27px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

<div class="register-container">

    <div class="brand">
        <div class="brand-icon">🛡️</div>
        <h1>Cyber<span>Shield</span></h1>
        <p>CYBER CRIME COMPLAINT PORTAL</p>
    </div>

    <div class="register-card">

        <div class="secure-tag">● SECURE REGISTRATION</div>

        <h2>Create Account</h2>
        <p class="subtitle">
            Register to report cybercrime and track your complaints securely.
        </p>

        <form method="POST">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    autocomplete="tel"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    required>
            </div>

            <button type="submit" class="register-btn">
                Create Account →
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="/login">Login here</a>
        </div>

    </div>

    <a href="/" class="back-link">← Back to Home</a>

    <div class="bottom-note">
        CYBERSHIELD • YOUR DIGITAL SAFETY MATTERS
    </div>

</div>

</body>
</html>
