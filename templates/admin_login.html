<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | CyberShield</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --green: #39ff14;
            --green-light: #a3ff91;
            --muted: #98a89b;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 22px;
            background:
                radial-gradient(ellipse at top, #142a18, transparent 55%),
                radial-gradient(circle at bottom right, #101d12, transparent 40%),
                #050807;
            color: #f1f5f2;
        }

        .container {
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 405px;
            padding: 36px 31px;
            background: linear-gradient(145deg, #111b13, #080d09);
            border: 1px solid #315a35;
            border-radius: 19px;
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.5),
                0 0 28px rgba(57, 255, 20, 0.07),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
            animation: appear 0.6s ease-out;
        }

        .container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 18%;
            width: 64%;
            height: 2px;
            background: var(--green);
            box-shadow: 0 0 18px var(--green);
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            width: 75px;
            height: 75px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 16px;
            border: 1px solid #43873b;
            border-radius: 22px;
            background: linear-gradient(145deg, #1b3020, #0b120c);
            font-size: 38px;
            box-shadow:
                0 0 25px rgba(57, 255, 20, 0.14),
                6px 6px 14px rgba(0, 0, 0, 0.4),
                inset 1px 1px 4px rgba(255, 255, 255, 0.05);
        }

        .brand {
            text-align: center;
            color: var(--green);
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 24px;
            text-shadow: 0 0 14px rgba(57, 255, 20, 0.25);
        }

        .admin-tag {
            display: table;
            margin: 0 auto 15px;
            padding: 6px 10px;
            border: 1px solid rgba(57, 255, 20, 0.22);
            border-radius: 5px;
            background: rgba(57, 255, 20, 0.06);
            color: var(--green);
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 1.5px;
        }

        h2 {
            text-align: center;
            font-size: 23px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #d6e2d8;
            margin: 17px 0 9px;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #080e09;
            color: #f1f5f2;
            border: 1px solid #2b4430;
            border-radius: 9px;
            outline: none;
            font-size: 14px;
            transition: 0.25s;
        }

        input::placeholder {
            color: #708073;
        }

        input:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(57, 255, 20, 0.09);
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: var(--green);
            color: #061006;
            border: 1px solid var(--green);
            border-radius: 9px;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 5px 0 #1b7c12;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow:
                0 7px 0 #1b7c12,
                0 0 22px rgba(57, 255, 20, 0.17);
            filter: brightness(1.05);
        }

        button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #1b7c12;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: var(--green-light);
            text-decoration: none;
            font-size: 13px;
            transition: 0.2s;
        }

        .back:hover {
            color: white;
        }

        .security {
            text-align: center;
            margin-top: 25px;
            padding-top: 18px;
            border-top: 1px solid #1c2e20;
            color: #819083;
            font-size: 11px;
            line-height: 1.7;
        }

        .security span {
            color: var(--green);
        }

        @media (max-width: 450px) {
            .container {
                padding: 30px 22px;
            }

            .brand {
                font-size: 25px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="logo">🛡️</div>
        <div class="brand">CyberShield</div>

        <div class="admin-tag">● RESTRICTED ACCESS</div>

        <h2>Admin Login</h2>
        <p class="subtitle">Secure administrator access to the control panel.</p>

        <form method="POST" action="/admin" autocomplete="off">

            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                value=""
                autocomplete="off"
                autocapitalize="none"
                spellcheck="false"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                value=""
                autocomplete="new-password"
                required
            >

            <button type="submit">Login to Dashboard →</button>

        </form>

        <a href="/" class="back">← Back to Home</a>

        <p class="security">
            🔒 <span>Protected Admin Area</span><br>
            Authorized administrators only
        </p>

    </div>
</body>
</html>
